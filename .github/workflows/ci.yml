name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python: "3.13"
          - os: macos-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest==8.3.5 ruff==0.17.6 bandit==1.9.4 reuse==6.3.0 pip-audit==2.10.1
      - run: bash scripts/check.sh
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install build==1.2.2.post1
      - run: python -m build
      - name: Install the wheel in a clean venv and run it
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          cd /tmp
          d=$(mktemp -d)  # owner-only folder; Core refuses shared folders like /tmp
          /tmp/clean/bin/syrebrum-core --version
          /tmp/clean/bin/syrebrum-core --db "$d/t.db" submit core.echo
          /tmp/clean/bin/syrebrum-core --db "$d/t.db" work
          /tmp/clean/bin/syrebrum-core --db "$d/t.db" verify
          set +e
          /tmp/clean/bin/syrebrum-core --db "$d/t.db" check fs.write /tmp/x
          code=$?
          set -e
          test "$code" -eq 3
      - name: Check the wheel license metadata
        run: |
          python - <<'PY'
          import glob, zipfile
          whl = glob.glob("dist/*.whl")[0]
          z = zipfile.ZipFile(whl)
          meta = next(n for n in z.namelist() if n.endswith(".dist-info/METADATA"))
          text = z.read(meta).decode()
          assert "License-Expression: Apache-2.0" in text, "missing License-Expression"
          names = z.namelist()
          assert any(n.endswith("licenses/LICENSE") for n in names), "LICENSE not in wheel"
          assert any(n.endswith("licenses/NOTICE") for n in names), "NOTICE not in wheel"
          PY
      - name: Check the source archive contents
        run: |
          tar tzf dist/*.tar.gz | sort > files.txt
          grep -q 'LICENSE$' files.txt
          grep -q 'NOTICE$' files.txt
          ! grep -Ei 'RELEASE_PLAN|PRIVATE_|CANDIDATE_|DECISIONS' files.txt
