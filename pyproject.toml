[build-system]
requires = ["setuptools>=78.1"]
build-backend = "setuptools.build_meta"

[project]
name = "syrebrum-core"
version = "0.1.0"
description = "Local-first, deny-by-default job orchestration with tamper-evident receipts"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "CCD Enterprise & Development LLC" }]
requires-python = ">=3.10"
dependencies = []
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: OS Independent",
  "Topic :: Security",
  "Topic :: System :: Distributed Computing",
]

[project.urls]
Homepage = "https://www.syrebrum.com/core/"
Documentation = "https://github.com/glschaefer09-ux/syrebrum-core/tree/main/docs"
Issues = "https://github.com/glschaefer09-ux/syrebrum-core/issues"
Source = "https://github.com/glschaefer09-ux/syrebrum-core"

[project.scripts]
syrebrum-core = "syrebrum_core.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
